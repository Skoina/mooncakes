<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#241a40"><meta name="description" content="波皮與嚕卡DUA 的中秋疊疊樂。點一下放月餅，疊滿二十個一起慶中秋！"><title>月餅不要掉！｜中秋疊疊樂</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app" aria-label="月餅不要掉手機遊戲">
<section id="loading" class="screen loading active"><div class="home-art"></div><div class="home-shade"></div><div class="loading-copy"><h1>月餅不要掉！</h1><p>月光與月餅準備中…</p><div class="progress"><i></i></div></div></section>
<section id="entry" class="screen entry"><div class="home-art"></div><div class="home-shade"></div><div class="entry-content"><div class="entry-moon">🌕</div><h1>月餅不要掉！</h1><p>波皮與嚕卡DUA 的中秋疊疊樂</p><button id="enter" class="primary">🔊 開啟音樂，進入遊戲</button><small>點一下，就能邊聽音樂邊玩</small></div></section>
<section id="home" class="screen home"><div class="home-art"></div><div class="home-shade"></div><canvas id="home-decor" class="home-decor" aria-hidden="true"></canvas><div class="home-content"><span class="eyebrow">波皮 × 嚕卡DUA</span><h1>月餅<br>不要掉<span>！</span></h1><p class="subtitle">兩隻狗狗的中秋疊疊樂</p><button id="start" class="primary">開始疊月餅 <span>🥮</span></button><button id="home-endless" class="secondary hidden">遊玩無限中秋模式</button><div class="home-meta"><button id="sound" class="quiet" aria-label="切換音樂與音效">🔊 音樂開</button><span id="home-best">最高紀錄：0 個</span></div><small id="music-hint" class="music-hint">背景音樂播放中 ♪</small></div><div class="bottom-caption">月圓餅香 · 一起來疊高高 <b>庭園版 v3.7</b></div></section>
<section id="play" class="screen game"><canvas id="game" aria-label="疊月餅遊戲，輕觸畫面放下月餅"></canvas><div class="hud"><div class="hud-left"><div class="hud-score-line"><button id="home-game" class="home-icon" aria-label="回首頁" title="回首頁"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9M10 21v-7h4v7"/></svg></button><span id="count">月餅 × 00</span></div><small id="best">BEST 00</small><small>庭園版 v3.7</small></div><div class="hud-right"><button id="end-challenge" class="end-challenge hidden">結束挑戰</button><button id="game-sound" class="sound-dot" aria-label="切換音效">♫</button><span id="hearts" aria-label="三條生命">♥ ♥ ♥</span></div></div><div id="notice" class="notice" aria-live="polite"></div><div id="goal-tip" class="goal-tip hidden" role="status"><strong>目標：疊滿 20 個月餅！</strong><span>「十」分如意、「十」分順心</span></div><div id="tutorial" class="tutorial hidden"><div class="hand">☝</div><strong>點一下，放下月餅！</strong><p>盡量疊整齊，不要讓月餅掉下去</p></div><button id="drop" class="drop-zone" aria-label="放下月餅"></button></section>
<section id="result" class="screen result"><button id="home-result" class="home-icon screen-home" aria-label="回首頁" title="回首頁"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9M10 21v-7h4v7"/></svg></button><div class="result-card"><canvas id="result-dogs" class="result-dogs" aria-hidden="true"></canvas><h2 id="result-title">月餅掉光啦！</h2><p id="result-line"></p><div class="score-row"><div>本局<strong id="result-score">0</strong></div><div>最高<strong id="result-best">0</strong></div></div><div id="result-rank" class="rank"></div><p id="result-joke"></p><button id="retry" class="primary">再疊一次</button><button id="endless" class="secondary hidden">遊玩無限中秋模式</button><button id="open-card" class="secondary">觀看祝賀 🎁</button></div></section>
<section id="greeting" class="screen greeting"><div class="greeting-image"></div><button id="home-greeting" class="home-icon screen-home" aria-label="回首頁" title="回首頁"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9M10 21v-7h4v7"/></svg></button><div class="greeting-content"><button id="again" class="primary">重新開始</button></div></section>
</main><audio id="bgm" src="audio/jade-rabbits-kitchen.mp3" preload="auto" loop></audio><script src="game.js" defer></script></body></html>
